<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dance Project Testing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f7f7f7;
        }
        .container {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            max-width: 500px;
            margin: auto;
        }
        h1 {
            color: #2d2d2d;
            text-align: center;
        }
        p {
            color: #555;
            text-align: center;
        }
        button {
            display: block;
            margin: 24px auto 0;
            padding: 12px 32px;
            font-size: 1rem;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #357ab8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dance Project Testing</h1>
        <p>Welcome to the Dance Project testing page.</p>
        <button onclick="alert('Dance Project Test Successful!')">Run Test</button>
    </div>
</body>
</html>
