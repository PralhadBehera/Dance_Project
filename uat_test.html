<!-- uat.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dance Project UAT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #fffbea;
    }
    .container {
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 500px;
      margin: auto;
    }
    h1 {
      color: #b07d00;
      text-align: center;
    }
    p {
      color: #555;
      text-align: center;
    }
    button {
      display: block;
      margin: 24px auto 0;
      padding: 12px 32px;
      font-size: 1rem;
      background: #f4c430;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #d4a800;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dance Project UAT</h1>
    <p>This is the User Acceptance Testing version.</p>
    <button onclick="alert('Dance Project UAT Test Successful!')">Run UAT Test</button>
  </div>
</body>
</html>
