<!-- prod.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dance Project - Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #e8f5e9;
    }
    .container {
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 500px;
      margin: auto;
    }
    h1 {
      color: #2e7d32;
      text-align: center;
    }
    p {
      color: #444;
      text-align: center;
    }
    button {
      display: block;
      margin: 24px auto 0;
      padding: 12px 32px;
      font-size: 1rem;
      background: #66bb6a;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #43a047;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dance Project - Live</h1>
    <p>This is the Production version of the Dance Project.</p>
    <button onclick="alert('Welcome to the Live Dance Project!')">Start</button>
  </div>
</body>
</html>
